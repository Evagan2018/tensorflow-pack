name: Matrix target and compiler probe
on:
  push:
    branches: [test-infrastructure-cmsis-ethos-u]
    paths: ['.github/workflows/matrix_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: ARM-software/cmsis-actions/vcpkg@v1
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          config: './tensorflow-test/matrix/vcpkg-configuration.json'
      - uses: ARM-software/cmsis-actions/armlm@v1
      - name: Trace existing firmware startup
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p probe
          gh run download 40698354144 -n int8-M4-CMSISNN-AC6 -D m4
          gh run download 40698354144 -n int8-M55-CMSISNN-AC6 -D m55
          find .vcpkg -iname '*Tarmac*' > probe/plugins.txt
          plugin=$(find .vcpkg -name 'TarmacTrace.so' | head -1)
          test -n "$plugin"
          FVP_MPS2_Cortex-M4 --plugin "$plugin" --list-params > probe/trace-parameters.txt
          FVP_MPS2_Cortex-M4 --plugin "$plugin" -C TRACE.TarmacTrace.trace-file=probe/m4-trace.txt -f m4/MatrixBoard/fvp_config.txt -a m4/operators-positive.elf --simlimit 0.01 > probe/m4.log 2>&1
          FVP_MPS2_Cortex-M55 --plugin "$plugin" -C TRACE.TarmacTrace.trace-file=probe/m55-trace.txt -f m55/MatrixBoard/fvp_config.txt -a m55/operators-positive.elf --simlimit 0.01 > probe/m55.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matrix-probe
          path: probe/
