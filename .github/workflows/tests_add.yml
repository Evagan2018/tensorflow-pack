name: Generated ADD operator test

on:
  push:
    branches: [test-infrastructure-cmsis-ethos-u]
    paths:
      - 'tensorflow-test/add/**'
      - '.github/workflows/tests_add.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: 'gitlab revision'
        required: false
        default: '26.08'
      candidate_rev:
        description: 'Release candidate revision'
        required: false
        default: 'rc4'

run-name: ADD Reference CPU test with tensorflow pack ${{ inputs.revision || '26.08' }}_${{ inputs.candidate_rev || 'rc4' }}

permissions:
  contents: read

jobs:
  build-and-run:
    name: ADD Reference CPU (GCC)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: litert
    steps:
      - name: Checkout pack test helpers
        uses: actions/checkout@v7
        with:
          path: pack-ci

      - name: Checkout CMSIS-LiteRT
        uses: actions/checkout@v7
        with:
          repository: Evagan2018/CMSIS-LiteRT
          ref: 84bdb98f2045ce299686364518615177ecb0fe25
          path: litert

      # Same path and key as release.yml; no fallback keys.
      - name: Restore selected candidate packs
        id: candidate
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/out
          key: latest-tensorflow-pack-build_${{ inputs.revision || '26.08' }}_${{ inputs.candidate_rev || 'rc4' }}
          fail-on-cache-miss: true

      - name: Require an exact cache match
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          echo '::error::The exact candidate cache is unavailable. Build this release/candidate first.'
          exit 1

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: './litert/vcpkg-configuration.json'

      # The pinned FVP needs the complete Python 3.11 standard library.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Select exact candidate versions
        run: |
          python -m pip install -r ../pack-ci/tensorflow-test/add/requirements.txt
          python -m unittest discover -s ../pack-ci/tensorflow-test/add -p "test_*.py"
          python ../pack-ci/.github/scripts/litert_candidate.py fetch-driver --packs ../out
          python ../pack-ci/.github/scripts/litert_candidate.py prepare --packs ../out --checkout .
          git rev-parse HEAD | tee example-commit.txt

      - name: Install candidate packs
        run: cpackget add ../out/*.pack -a

      - name: Generate ADD model and CPU consumer
        env:
          TF_ENABLE_ONEDNN_OPTS: '0'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
        run: python ../pack-ci/tensorflow-test/add/generate.py --checkout . > generation.log

      - name: Build Reference CPU test and verify resolved packs
        run: |
          cbuild cmsis-litert.csolution.yml --active SSE-320-CPU --toolchain GCC --packs --update-rte 2>&1 | tee build.log
          python ../pack-ci/.github/scripts/litert_candidate.py verify --checkout .

      - name: Execute ADD and require a numerical pass
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: python ../pack-ci/tensorflow-test/add/run_fvp.py --checkout . --name positive

      - name: Corrupt one expected value and rebuild
        run: |
          cp AddTest/test_data.h AddTest/test_data.positive.h
          python ../pack-ci/tensorflow-test/add/negative_control.py --header AddTest/test_data.h
          cbuild cmsis-litert.csolution.yml --active SSE-320-CPU --toolchain GCC --update-rte 2>&1 | tee negative-build.log
          python ../pack-ci/.github/scripts/litert_candidate.py verify --checkout .

      - name: Require the numerical checker to detect the wrong expected value
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: python ../pack-ci/tensorflow-test/add/run_fvp.py --checkout . --name negative --expect-numerical-failure

      - name: Upload ADD evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: add-reference-cpu
          path: |
            litert/AddTest/
            litert/*.log
            litert/positive.json
            litert/negative.json
            litert/candidate-packs.json
            litert/example-commit.txt
            litert/*.cbuild*.yml
            litert/*.csolution.yml
            litert/*.cproject.yml
            litert/board/Corstone-320/
            litert/out/**/*.elf
