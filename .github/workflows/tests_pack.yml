name: Pack infrastructure checks

on:
  push:
    branches: [test-infrastructure-cmsis-ethos-u]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python -m unittest discover -s tensorflow-test/add -p 'test_*.py'
      - run: python -m unittest discover -s tensorflow-test/operators -p 'test_*.py'
      - run: python -m unittest discover -s tensorflow-test/matrix -p 'test_*.py'
      - name: Check build wrapper syntax
        run: |
          sh -n tensorflow-build/build_r.sh
          sh -n tensorflow-build/build_d.sh
          sh -n 3rdparty-build/build_r.sh
          sh -n 3rdparty-build/build_d.sh
      - name: Verify published driver artifact
        run: python .github/scripts/litert_candidate.py fetch-driver --packs driver
