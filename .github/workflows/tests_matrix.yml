name: Int8 CMSIS-NN compiler and core matrix

on:
  push:
    branches: [test-infrastructure-cmsis-ethos-u]
    paths:
      - 'tensorflow-test/operators/**'
      - 'tensorflow-test/common/**'
      - 'tensorflow-test/matrix/**'
      - '.github/workflows/tests_matrix.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: 'gitlab revision'
        required: false
        default: '26.08'
      candidate_rev:
        description: 'Release candidate revision'
        required: false
        default: 'rc4'

run-name: Int8 CMSIS-NN matrix with tensorflow pack ${{ inputs.revision || '26.08' }}_${{ inputs.candidate_rev || 'rc4' }}

permissions:
  contents: read

jobs:
  build-and-run:
    name: int8 ${{ matrix.target }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        target: [M4-CMSISNN, M55-CMSISNN]
        compiler: [GCC, AC6, CLANG]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: litert
    steps:
      - name: Checkout pack test helpers
        uses: actions/checkout@v7
        with:
          path: pack-ci

      - name: Checkout CMSIS-LiteRT
        uses: actions/checkout@v7
        with:
          repository: Evagan2018/CMSIS-LiteRT
          ref: 84bdb98f2045ce299686364518615177ecb0fe25
          path: litert

      # Same path and key as release.yml; no fallback keys.
      - name: Restore selected candidate packs
        id: candidate
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/out
          key: latest-tensorflow-pack-build_${{ inputs.revision || '26.08' }}_${{ inputs.candidate_rev || 'rc4' }}
          fail-on-cache-miss: true

      - name: Require an exact cache match
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          echo '::error::The exact candidate cache is unavailable. Build this release/candidate first.'
          exit 1

      - name: Install tools
        env:
          TMPDIR: ${{ runner.temp }}
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: './pack-ci/tensorflow-test/matrix/vcpkg-configuration.json'

      # The pinned FVP needs the complete Python 3.11 standard library.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Activate FVP license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Record exact compiler identities
        run: |
          cbuild list toolchains | tee compiler-packages.txt
          arm-none-eabi-gcc --version > gcc-version.txt
          armclang --version > ac6-version.txt
          clang --version > clang-version.txt

      - name: Select exact candidate versions
        run: |
          python -m pip install -r ../pack-ci/tensorflow-test/add/requirements.txt
          python -m unittest discover -s ../pack-ci/tensorflow-test/operators -p "test_*.py"
          python ../pack-ci/.github/scripts/litert_candidate.py fetch-driver --packs ../out
          python ../pack-ci/.github/scripts/litert_candidate.py prepare --packs ../out --checkout .
          git rev-parse HEAD | tee example-commit.txt

      - name: Install candidate packs
        run: cpackget add ../out/*.pack -a

      - name: Generate full-int8 models and target consumer
        env:
          TF_ENABLE_ONEDNN_OPTS: '0'
          TF_NUM_INTEROP_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
        run: python ../pack-ci/tensorflow-test/operators/generate.py --checkout . --packs ../out --target ${{ matrix.target }} --compiler ${{ matrix.compiler }} > generation.log

      - name: Build CMSIS-NN target and verify resolved packs
        run: |
          cbuild cmsis-litert.csolution.yml --active ${{ matrix.target }} --toolchain ${{ matrix.compiler }} --packs --update-rte 2>&1 | tee build.log
          python ../pack-ci/.github/scripts/litert_candidate.py verify --checkout .

      - name: Verify linked CMSIS-NN and Helium code
        id: audit
        run: python ../pack-ci/tensorflow-test/matrix/binary_audit.py --checkout .

      - name: Execute every manifest case and require numerical passes
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: python ../pack-ci/tensorflow-test/operators/run_fvp.py --checkout . --name operators-positive

      - name: Corrupt one expected value and rebuild
        id: negative_build
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        run: |
          cp OperatorTest/control.h OperatorTest/control.positive.h
          python ../pack-ci/tensorflow-test/operators/negative_control.py --header OperatorTest/control.h
          cbuild cmsis-litert.csolution.yml --active ${{ matrix.target }} --toolchain ${{ matrix.compiler }} --update-rte 2>&1 | tee negative-build.log
          python ../pack-ci/.github/scripts/litert_candidate.py verify --checkout .

      - name: Require the numerical checker to detect the wrong expected value
        if: ${{ !cancelled() && steps.negative_build.outcome == 'success' }}
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: python ../pack-ci/tensorflow-test/operators/run_fvp.py --checkout . --name operators-negative --negative

      - name: Upload complete operator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: int8-${{ matrix.target }}-${{ matrix.compiler }}
          path: |
            litert/OperatorTest/
            litert/*.log
            litert/operators-positive.json
            litert/operators-negative.json
            litert/operators-positive.elf
            litert/operators-negative.elf
            litert/*.junit.xml
            litert/candidate-packs.json
            litert/example-commit.txt
            litert/*.cbuild*.yml
            litert/*.csolution.yml
            litert/*.cproject.yml
            litert/MatrixBoard/
            litert/*-version.txt
            litert/compiler-packages.txt
            litert/tmp/**/*.map
            litert/out/**/*.elf
            litert/binary-audit.json
            litert/binary-disassembly.txt
