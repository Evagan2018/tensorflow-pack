<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">How the first ADD operator test works</title><desc id="desc">Select the pack, generate an ADD model and expected answers on the computer, compile the consumer using GCC, execute on a simulated Cortex-M CPU, and compare numerical results. Then repeat with a wrong expected answer to prove failures are detected. This test does not use the NPU.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#536c82"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#163148}.h{font-size:21px;font-weight:bold}.b{font-size:17px}.small{font-size:15px}.edge{fill:none;stroke:#536c82;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1200" height="715" rx="15" fill="#f5f8fc"/><text x="30" y="42" style="font-size:29px;font-weight:bold">One ADD test, from model to checked answer</text><text x="30" y="76" class="b">Reference CPU • float32 numbers • shape [1, 4] • one operator • no NPU execution</text><text x="30" y="110" class="small">PREPARE ON THE DEVELOPMENT COMPUTER / GITHUB RUNNER</text><rect x="30" y="125" width="350" height="140" rx="13" fill="#e0edf9" stroke="#99b3c5"/><text x="48" y="160" class="h">1  Select the pack</text><text x="48" y="201" class="b">Five TensorFlow packs: 1.26.8-rc4</text><text x="48" y="233" class="b">Check identities and dependencies.</text><rect x="425" y="125" width="350" height="140" rx="13" fill="#e0edf9" stroke="#99b3c5"/><text x="443" y="160" class="h">2  Make a tiny ADD model</text><text x="443" y="201" class="b">Two inputs, each with four numbers.</text><text x="443" y="233" class="b">Verify the model still contains ADD.</text><rect x="820" y="125" width="350" height="140" rx="13" fill="#e0edf9" stroke="#99b3c5"/><text x="838" y="160" class="h">3  Prepare the answer sheet</text><text x="838" y="201" class="b">Run the host reference interpreter.</text><text x="838" y="233" class="b">Also check ordinary array addition.</text><rect x="820" y="340" width="350" height="140" rx="13" fill="#dff0e7" stroke="#99b3c5"/><text x="838" y="375" class="h">4  Build the test program</text><text x="838" y="416" class="b">Embed model + inputs + answers.</text><text x="838" y="448" class="b">GCC links the pack’s Reference kernel.</text><rect x="425" y="340" width="350" height="140" rx="13" fill="#dff0e7" stroke="#99b3c5"/><text x="443" y="375" class="h">5  Run on a simulated board</text><text x="443" y="416" class="b">FVP simulates Corstone-320.</text><text x="443" y="448" class="b">The Cortex-M CPU executes ADD.</text><rect x="30" y="340" width="350" height="140" rx="13" fill="#dff0e7" stroke="#99b3c5"/><text x="48" y="375" class="h">6  Check every answer</text><text x="48" y="416" class="b">Check output type, shape and values.</text><text x="48" y="448" class="b">Missing results or timeouts fail.</text><path class="edge" d="M380 195H425"/><path class="edge" d="M775 195H820"/><path class="edge" d="M995 265V340"/><path class="edge" d="M820 410H775"/><path class="edge" d="M425 410H380"/><text x="30" y="320" class="small">READ THIS ROW FROM RIGHT TO LEFT: BUILD → EXECUTE → CHECK</text><rect x="30" y="515" width="1140" height="82" rx="12" fill="#fff0d6" stroke="#bb985d"/><text x="48" y="547" class="h">A second run checks the checker</text><text x="48" y="578" class="b">Change the first expected answer from −2 to 99 → rebuild → run again → require a numerical FAIL.</text><text x="30" y="633" class="b">Inputs: [−3, 0, 0.5, 16] + [1, −2, 0.25, −8]     Correct answer: [−2, −2, 0.75, 8]</text><text x="30" y="668" class="small">Dependencies: TensorFlow converter + host interpreter → CMSIS-Toolbox + GCC → board startup + FVP</text><text x="30" y="694" class="small">CMSIS-Ethos-U stays pinned as a pack dependency; its NPU driver component is not selected in this CPU test.</text></svg>